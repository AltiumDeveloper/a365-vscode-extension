name: Bug report
description: Something in the extension does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you attach logs or screenshots, please scrub them. The **Altium 365**
        Output channel echoes script parameters and other request detail, which can
        include workspace IDs, project names and anything your own script prints.
        Never paste an access token. If you believe you have found a security
        vulnerability, do not open an issue — see
        [SECURITY.md](https://github.com/AltiumDeveloper/a365-vscode-extension/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Extensions view → Altium Developer → version number.
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version and OS
      description: "From **Help: About** (Code → About on macOS)."
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`. Leave blank if the bug does not involve running a script.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Lines from the Altium 365 Output channel, scrubbed as described above.
      render: text
    validations:
      required: false
