name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - name: Package VSIX
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: altium365-vsix
          path: '*.vsix'
